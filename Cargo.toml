[package]
name = "tree-sitter-carve"
description = "Carve grammar for the tree-sitter parsing library"
version = "0.1.4"
keywords = ["incremental", "parsing", "tree-sitter", "Carve"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/markup-carve/tree-sitter-carve"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = ">=0.22.0"

[build-dependencies]
cc = "1.0"
