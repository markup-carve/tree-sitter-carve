name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tree-sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate parser
        run: npm run generate
      - name: Check generated files
        run: git diff --exit-code
      - name: Run corpus tests
        run: npm test
      - name: Build WASM grammar
        run: npm run build-wasm
      - name: Load Node binding
        run: |
          node - <<'NODE'
          const grammar = require('./bindings/node')
          if (grammar.name !== 'carve') {
            throw new Error(`Expected carve grammar, got ${grammar.name}`)
          }
          NODE

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust binding tests
        run: cargo test
