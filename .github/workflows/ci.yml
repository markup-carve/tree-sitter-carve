name: CI

on:
  push:
    branches: [main, next2]
  pull_request:
    branches: [main, next2]

# A new push to a pull request makes its running checks moot. Pushes to main
# each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  tree-sitter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/npm-install
      - name: Check grammar.js formatting
        run: npm run check-formatted
      - name: Generate parser
        run: npm run generate
      - name: Check generated files are up to date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      # Dynamic precedence is int16_t in the generated tables, so a value past
      # 32767 wraps without an error. The compiler's -Woverflow is the only
      # signal, and editors compile this file on users' machines (#385).
      - name: Generated tables hold every value grammar.js asks for
        run: npm run test:parser-warnings
      - name: Run the corpus
        run: npm test
      - name: Compile the editor queries
        run: |
          printf '= Heading\n' > /tmp/carve-query.crv
          for query in queries/*.scm; do
            npx tree-sitter query -q "$query" /tmp/carve-query.crv
          done
      - name: The release version guard fires on each drift it names
        run: npm run test:version-surfaces
      - name: A missing final terminator changes no tree
        run: npm run test:final-terminator
      - name: Check editor query ranges
        run: npm run test:editor-queries
      - name: Marker separators are runs, and none of a run is content
        run: npm run test:marker-separators

      # The CLI builds src/scanner.c at -O2; node-gyp builds it at -O3, and that
      # is what an editor loads. A write past an allocation that only the -O3
      # build makes leaves the CLI parsing happily (#266).
      - name: Nesting depth through the Node binding
        run: npm run test:nesting-depth
      - name: Load Node binding
        run: |
          node - <<'NODE'
          const grammar = require('./bindings/node')
          if (grammar.name !== 'carve') {
            throw new Error(`Expected carve grammar, got ${grammar.name}`)
          }
          NODE
      - name: Node binding agrees with the CLI over the corpus
        run: npm run test:binding-parity

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/tmp/tree-sitter-cache
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/npm-install
      - name: Build the WASM grammar
        run: |
          npm run build-wasm
          test -s tree-sitter-carve.wasm
      - name: Run the corpus through WASM
        run: npx tree-sitter test --wasm
      - name: Load the grammar and highlights in supported web-tree-sitter versions
        run: npm run test:wasm

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/npm-install
      - name: Parse the corpus and deep nesting with ASAN at -O${{ matrix.optimization }}
        env:
          ASAN_OPTIMIZATION: ${{ matrix.optimization }}
        run: npm run test:asan

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The JS half of this file has gated formatting since it was written
      # (`npm run check-formatted`); the Rust half never has, and the bindings
      # are hand-edited, so the drift only went one way. It had drifted, at
      # bindings/rust/lib.rs:356, and nothing could say so: a gate that runs on
      # a contributor's machine but not here reads as "main is broken for a
      # reason nobody wrote down", which is worse than no gate.
      - name: Check Rust binding formatting
        run: cargo fmt --check

      - name: Run Rust binding tests
        run: cargo test
