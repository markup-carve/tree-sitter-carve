name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tree-sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check grammar.js formatting
        run: npm run check-formatted
      - name: Generate parser
        run: npm run generate
      - name: Check generated files are up to date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      - name: Run hand-written corpus tests
        run: npm test
      - name: Coverage matrix and shared-corpus conformance
        run: npm run test:corpus

      # The shape-level counterpart to corpus conformance. The corpus checks
      # whole documents the spec ships; the battery checks the one-line forms
      # that sit on a rule's boundary, which is where a grammar drifts first -
      # and it is what every other Carve grammar already runs.
      - name: Block battery
        run: npm run test:battery

      # The mirror of the over-acceptance check: the language builds a block
      # and the grammar builds none. Not an ERROR - the input falls back to a
      # paragraph and the tree is clean - so nothing else can see it.
      - name: Under-acceptance
        run: npm run test:under-acceptance

      - name: No-ERROR sweep
        run: npm run test:no-error

      # The third blind spot in the same family: a construct that swallows the
      # lines below it into one block. No ERROR, the block count is right, and
      # `paragraph` is unmapped in the under-acceptance sweep by design - so a
      # whole line-ending spelling went unmodeled with every check green.
      - name: Line terminators
        run: npm run test:line-terminators

      # The queries are the other half of what this repo ships - vim-carve,
      # helix-carve and zed-carve load these files - and nothing here read them.
      # A capture naming a node that no longer exists, or two patterns claiming
      # one node with nobody deciding which wins, left every check green.
      - name: Highlight captures resolve the way an editor resolves them
        run: npm run test:highlights

      # WHERE A MARKER ENDS AND ITS CONTENT BEGINS. Every check above reads the
      # SHAPE of the tree - which nodes, in what order, with or without an
      # ERROR - and a tree-sitter grammar's deliverable is EXTENTS. A caption
      # whose marker stopped one space early built the right nodes in the right
      # order with no ERROR, and all of them stayed green.
      - name: Marker separators are runs, and none of a run is content
        run: npm run test:marker-separators

      # THE ONE CLASS EVERY GATE ABOVE IS BLIND TO. All of them drive the
      # tree-sitter CLI, which builds src/scanner.c at -O2 into its own cached
      # shared object; node-gyp builds the same file at -O3, and that is what an
      # editor loads. A write past an allocation that only the -O3 build makes
      # left the CLI parsing happily and every check green, while eleven nested
      # `:::: note` openers aborted the Node binding (#266).
      - name: Nesting depth through the Node binding
        run: npm run test:nesting-depth

      - name: The vendored battery is still carve-grammars' copy
        run: npm run test:battery-drift
      - name: Build WASM grammar
        run: npm run build-wasm
      - name: Load Node binding
        run: |
          node - <<'NODE'
          const grammar = require('./bindings/node')
          if (grammar.name !== 'carve') {
            throw new Error(`Expected carve grammar, got ${grammar.name}`)
          }
          NODE
      - name: Node binding agrees with the CLI over the corpus
        run: npm run test:binding-parity

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The JS half of this file has gated formatting since it was written
      # (`npm run check-formatted`); the Rust half never has, and the bindings
      # are hand-edited, so the drift only went one way. It had drifted, at
      # bindings/rust/lib.rs:356, and nothing could say so: a gate that runs on
      # a contributor's machine but not here reads as "main is broken for a
      # reason nobody wrote down", which is worse than no gate.
      - name: Check Rust binding formatting
        run: cargo fmt --check

      - name: Run Rust binding tests
        run: cargo test
