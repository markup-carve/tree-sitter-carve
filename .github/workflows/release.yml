# This repo was tagged three times - 0.1.0, 0.1.1, 0.1.2 - and published to
# nothing. The tags exist, the GitHub releases exist, and no registry has ever
# served the package. This workflow is the missing half.
#
# THE GATE RUNS BEFORE PUBLISH, AND PUBLISH SITS BEHIND IT VIA `needs:`, not by
# step order. On 2026-08-18 carve-py's release put a corpus check in front of a
# publish step in the same job; the check failed, the step was skipped, the job
# went green, and PyPI served a vulnerable version while the release page said
# otherwise. A separate job with `needs:` is what makes the publish unreachable
# rather than merely later.
#
# THE GATE MEASURES THE PACKED TARBALL, not the source tree. A source tree that
# agrees with the CLI says nothing about what npm shipped: vscode-carve was
# found running two different engines at once because nobody hashed the
# installed tree.
#
# The spec corpus here comes from the `spec` SUBMODULE, so this repo cannot make
# the mistake its sibling bindings made - aiming a release gate at spec `main`
# holds an artifact to a corpus newer than the release it gates, which becomes
# unpassable the moment the spec moves after a tag. The gitlink IS the pin.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # A rehearsal. Everything runs - the version guard, the three-platform
  # prebuild matrix, the corpus gate over the packed tarball, and every
  # packaging check - and the three publish steps become --dry-run. The point is
  # that the first time this workflow runs should not be the moment a tag makes
  # it irreversible: npm, crates.io and PyPI all refuse to replace a published
  # version.
  workflow_dispatch:

jobs:
  guard:
    name: The tag matches every version surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIVE surfaces, not one. pyproject.toml, tree-sitter.json and the Makefile
      # sat at 0.1.0 through both 0.1.1 and 0.1.2 because nothing compared them
      # and no test pinned them against each other. Checking only package.json
      # would have shipped that divergence a third time.
      - name: Every manifest agrees with the tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No tag exists in a rehearsal, so package.json stands in for it and
            # the check becomes "do all four agree", which is the half that
            # caught three manifests sitting at 0.1.0 through two releases.
            tag="$(node -p 'require("./package.json").version')"
            echo "rehearsal: comparing every manifest against package.json ($tag)"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error::$1 declares '$2', tag is '$tag'"
              fail=1
            fi
          }
          check package.json    "$(node -p 'require("./package.json").version')"
          check tree-sitter.json "$(node -p 'require("./tree-sitter.json").metadata.version')"
          check Cargo.toml      "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          check pyproject.toml  "$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          exit $fail

      - name: The changelog describes this version
        run: |
          v="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && v="$(node -p 'require("./package.json").version')"
          grep -qE "^## \[?${v}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${v}"; exit 1; }

  # package.json already lists `prebuilds/**` in `files` and carries prebuildify
  # as a devDependency, so the packaging INTENDS prebuilds - nobody had ever run
  # the build. Without them `"install": "node-gyp-build"` falls through to
  # compiling 7.3MB of generated parser.c on every consumer machine, which needs
  # a working toolchain. A dry-run pack on 2026-08-18 carried 22 files and no
  # prebuilds at all.
  prebuild:
    name: Prebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run prebuildify
      - name: The prebuild exists and is not empty
        shell: bash
        run: |
          found="$(find prebuilds -type f -name '*.node' | wc -l)"
          [ "$found" -gt 0 ] || { echo "::error::prebuildify produced no .node for ${{ matrix.os }}"; exit 1; }
          find prebuilds -type f -name '*.node' -exec ls -l {} +
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/

  # Deliberately does NOT depend on `prebuild`. This is a correctness check on
  # the grammar, and coupling it to npm packaging would let a Windows prebuild
  # failure block the crates.io and PyPI publishes, which carry no prebuilds at
  # all. Installing without them makes node-gyp-build compile from source, which
  # is slower and measures the same parser.
  corpus-gate:
    name: Run the corpus through the packed tarball
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci


      # Pack, then install into a directory that shares nothing with the
      # checkout, so what gets measured is what a consumer would receive.
      - name: Pack and install the tarball
        id: pack
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball" tree-sitter

      - name: What the tarball actually carries
        run: |
          tar -tzf "${{ steps.pack.outputs.tarball }}" | sed 's/^package\///' | sort
          echo "---"
          # No prebuild assertion here on purpose - publish-npm owns that, and
          # this job is about whether the grammar is right.
          echo "(prebuild presence is asserted by publish-npm, not here)" 

      # Both checks against the INSTALLED binding. binding-parity compares the
      # node addon to the CLI over the corpus (the two have disagreed before -
      # see #216), and the no-ERROR sweep is the one check that can look outside
      # the corpus, because no Carve input may parse to ERROR.
      - name: The installed binding agrees with the CLI over the corpus
        env:
          CARVE_TS_BINDING: /tmp/consumer/node_modules/tree-sitter-carve
        run: npm run test:binding-parity

      - name: No input parses to ERROR
        run: npm run test:no-error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [guard, prebuild, corpus-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The gate deliberately does not measure prebuilds - it checks the
      # grammar, and coupling it to packaging would let a Windows build block
      # two registries that carry none. So this job owns the packaging half:
      # collect every platform's prebuild and refuse below three, because a
      # tarball missing one silently makes that platform compile from source.
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds-staging
      - name: Collect the prebuilds
        run: |
          mkdir -p prebuilds
          find prebuilds-staging -mindepth 2 -maxdepth 2 -type d -exec cp -r {} prebuilds/ \;
          find prebuilds -type f -name '*.node' | sort
      - name: Refuse to publish without prebuilds
        run: |
          n="$(find prebuilds -type f -name '*.node' | wc -l)"
          [ "$n" -ge 3 ] || { echo "::error::only $n prebuild(s) present; expected one per platform"; exit 1; }

      # A missing credential FAILS rather than skipping. A skipped publish that
      # leaves the job green is what half-released carve-py.
      - name: The npm credential is present
        run: |
          [ -n "${{ secrets.NPM_TOKEN }}" ] \
            || { echo "::error::NPM_TOKEN is not available to this repository"; exit 1; }

      - name: Publish to npm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --dry-run --access public
            echo "::notice::rehearsal - nothing was published to npm"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [guard, corpus-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      # A missing credential FAILS rather than skipping, for the same reason as
      # the npm job: a skipped publish that leaves the job green is what
      # half-released carve-py.
      - name: The crates.io credential is present
        run: |
          [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ] \
            || { echo "::error::CARGO_REGISTRY_TOKEN is not available to this repository"; exit 1; }

      # Cargo.toml's `include` is what decides whether the crate carries the
      # generated parser at all - bindings/rust, grammar.js, queries and src.
      # A crate published without src/parser.c compiles for nobody, and the
      # dry-run is the only place that shows the file list before it is
      # immutable on the registry.
      - name: What the crate would carry
        run: |
          v="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "CRATE_VERSION=$v" >> "$GITHUB_ENV"
          cargo package --list --allow-dirty | sort
          cargo package --allow-dirty
          test -f "target/package/tree-sitter-carve-${v}.crate" \
            || { echo "::error::cargo package produced no crate"; exit 1; }

      - name: The packaged crate carries the generated parser
        run: |
          tar -tzf "target/package/tree-sitter-carve-${CRATE_VERSION}.crate" \
            | grep -q 'src/parser\.c$' \
            || { echo "::error::the crate has no src/parser.c - it would compile for nobody"; exit 1; }

      - name: Publish to crates.io
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cargo publish --dry-run --allow-dirty
            echo "::notice::rehearsal - nothing was published to crates.io"
          else
            cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          fi

  build-python:
    name: Python wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # pyproject.toml already carries [tool.cibuildwheel] with build = "cp38-*",
      # so the wheel matrix is the configuration's own intent rather than a
      # choice made here.
      - uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      # setup.py names src/parser.c and src/scanner.c in ext_modules, and
      # setuptools carries ext_modules sources into an sdist on its own. It does
      # NOT carry HEADERS, and this extension compiles with include_dirs=["src"],
      # so it needs src/tree_sitter/*.h too. The npm tarball has them only
      # because package.json lists "src/**" in files; nothing grants the sdist
      # the same, and there is no MANIFEST.in. An sdist missing a header builds
      # for nobody while looking complete, so check every input the compile
      # actually reads rather than only the one that is easy to name.
      - name: The sdist carries everything the extension compiles from
        run: |
          f="$(ls dist/*.tar.gz)"
          listing="$(tar -tzf "$f")"
          missing=0
          for want in src/parser.c src/scanner.c src/tree_sitter/parser.h \
                      src/tree_sitter/array.h src/tree_sitter/alloc.h \
                      bindings/python/tree_sitter_carve/binding.c; do
            printf "%s\n" "$listing" | grep -q "/$want" || { echo "::error::sdist is missing $want"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::add a MANIFEST.in that grafts src/, or the published sdist cannot be built"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [guard, corpus-gate, build-python, build-python-sdist]
    steps:
      - name: The PyPI credential is present
        run: |
          [ -n "${{ secrets.PYPI_API_TOKEN }}" ] \
            || { echo "::error::PYPI_API_TOKEN is not available to this repository"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: staging
      - name: Collect the distributions
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec mv {} dist/ \;
          ls -l dist
          n="$(ls dist/*.whl 2>/dev/null | wc -l)"
          [ "$n" -ge 3 ] || { echo "::error::only $n wheel(s); expected one per platform"; exit 1; }
      # twine check validates the metadata the upload would send, which is the
      # dry run PyPI itself does not offer.
      - name: Validate the distributions
        run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name != 'workflow_dispatch'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Rehearsal notice
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::rehearsal - nothing was published to PyPI" 
